name: ci

# The portable suites need no GPU, Docker, Kubernetes or network service: unit, simulation-golden
# (the SIMULATION golden scenario) and tui. The real-local and real-gpu suites are opt-in on a
# machine that has the hardware (see README, "Development") and never run here.
on:
  push:
  pull_request:

jobs:
  portable:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            tui/target
          key: cargo-${{ hashFiles('tui/Cargo.lock') }}
      - run: python -m pip install pytest
      - name: Portable suites (a skipped test fails the run)
        env:
          AIOPS_FAIL_ON_SKIP: "1"
        run: python -m pytest -q -m "unit or simulation_golden or tui" -rs

  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Clean-machine check (non-editable install, no config, no workload)
        run: scripts/clean_machine_check.sh
