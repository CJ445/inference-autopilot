# CPU stand-in for vLLM ("basic" profile, PRD §10.1). Exposes vLLM-shaped signals.
# The fault is held in process memory, so replacing the pod really clears it.
apiVersion: v1
kind: Service
metadata: {name: vllm}
spec:
  clusterIP: None
  selector: {app: vllm}
  ports: [{name: metrics, port: 8000}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: vllm-standin}
data:
  server.py: |
    from http.server import BaseHTTPRequestHandler, HTTPServer
    state = {"fault": False, "failures": 0}

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                if state["fault"]:
                    state["failures"] += 1
                mem = 7_900_000_000 if state["fault"] else 4_000_000_000
                err = 0.4 if state["fault"] else 0.0
                body = (f"gpu_memory_used_bytes {mem}\n"
                        f"error_rate {err}\n"
                        f"allocation_failures_total {state['failures']}\n")
            else:
                body = "ok\n"
            self.send_response(200); self.end_headers(); self.wfile.write(body.encode())

        def do_POST(self):
            if self.path == "/fault":
                state["fault"] = True
            self.send_response(200); self.end_headers()

        def log_message(self, *a): pass

    HTTPServer(("0.0.0.0", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: vllm}
spec:
  serviceName: vllm
  replicas: 1
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      containers:
      - name: server
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports: [{containerPort: 8000}]
        readinessProbe: {httpGet: {path: /healthz, port: 8000}, periodSeconds: 1}
        resources:
          requests: {cpu: 50m, memory: 32Mi}
          limits: {cpu: 200m, memory: 64Mi}
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: vllm-standin}}]
