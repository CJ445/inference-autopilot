[pytest]
testpaths = tests
markers =
    unit: pure logic and in-process fakes; needs nothing but Python
    simulation_golden: the SIMULATION golden scenario and its isolation; needs nothing but Python
    tui: the Rust operator UI (needs cargo, or a built binary); no GPU, Docker or Kubernetes
    real_local: opt-in (AIOPS_INTEGRATION=1): a real Docker or kind cluster
    real_gpu: opt-in (AIOPS_GPU=1): a real NVIDIA GPU with real vLLM
